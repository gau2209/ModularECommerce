services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: modularcommerce-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "AnhTuanabc_2209"
    ports:
      - "1433:1433"
    volumes:
      - modularcommerce_sqlserver_data:/var/opt/mssql
    networks:
      - modularcommerce-network

  seq:
    image: datalust/seq:latest
    container_name: modularcommerce-seq
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_NOAUTHENTICATION: "true"
    ports:
      - "5341:80"
    volumes:
      - modularcommerce_seq_data:/data
    networks:
      - modularcommerce-network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: modularcommerce-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - modularcommerce-network

networks:
  modularcommerce-network:
    driver: bridge

volumes:
  modularcommerce_sqlserver_data:
  modularcommerce_seq_data: